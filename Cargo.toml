[package]
name = "embedding-app"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI Framework
eframe = "0.27"  # Framework for running EGUI apps
egui = "0.27"    # The GUI library itself


# File operations
anyhow = "1.0"   # For easy error handling
thiserror = "1.0" # For custom error types



rfd = "0.14"  # Rust File Dialog - for file picking
tokio = { version = "1.0", features = ["full"] }  # For async file operations